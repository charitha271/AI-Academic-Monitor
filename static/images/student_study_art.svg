<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="100" r="90" fill="url(#grad1)" filter="blur(20px)"/>

  <!-- Analytics Mini Card -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="45" width="130" height="95" rx="10" fill="#151D2E" stroke="#263247" stroke-width="1.2"/>
    <rect x="40" y="60" width="45" height="6" rx="3" fill="#64748B"/>
    <rect x="40" y="72" width="60" height="12" rx="4" fill="#F8FAFC"/>
    <!-- Sparkline -->
    <path d="M40 115 L62 102 L80 108 L105 92 L130 96" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="96" r="3.5" fill="#6366F1"/>
    <path d="M40 115 L62 102 L80 108 L105 92 L130 96 L130 125 L40 125 Z" fill="#6366F1" fill-opacity="0.15"/>
  </g>

  <!-- AI Prediction Chip -->
  <g filter="url(#cardShadow)">
    <rect x="170" y="25" width="125" height="58" rx="8" fill="#151D2E" stroke="#263247" stroke-width="1.2"/>
    <circle cx="190" cy="45" r="9" fill="rgba(16, 185, 129, 0.2)"/>
    <path d="M187 45 L189.5 47.5 L193.5 42.5" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="206" y="38" width="65" height="6" rx="3" fill="#94A3B8"/>
    <rect x="206" y="48" width="40" height="8" rx="3" fill="#10B981"/>
  </g>

  <!-- Academic Center Shield / Badge -->
  <g filter="url(#cardShadow)">
    <circle cx="210" cy="130" r="38" fill="url(#primaryGrad)"/>
    <!-- Graduation Cap / Scholar Icon -->
    <path d="M210 115 L192 124 L210 133 L228 124 Z" fill="#FFFFFF"/>
    <path d="M198 127.5 V136.5 C198 139.5 203.5 142 210 142 C216.5 142 222 139.5 222 136.5 V127.5 L210 133.5 Z" fill="#FFFFFF" fill-opacity="0.85"/>
    <path d="M228 125.5 V135" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="228" cy="136" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Decorative Orbit Dots -->
  <circle cx="65" cy="28" r="3" fill="#06B6D4"/>
  <circle cx="140" cy="30" r="2" fill="#818CF8"/>
  <circle cx="285" cy="115" r="3.5" fill="#6366F1" fill-opacity="0.8"/>
  <circle cx="170" cy="170" r="2" fill="#06B6D4" fill-opacity="0.8"/>
</svg>